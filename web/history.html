<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="eel.js"></script>

    
    <title>MyScreenTimeHistory</title>
</head>
<body>
    <h1 id="title">MyScreenTime</h1>
      
    <div class="menu">
        <a href="index.html">
            <button class="menubtn", onclick="eel.recreate_appstimer()">🏠<h4 class="invisible">Home</h4></button>
        </a>
        <a href="history.html">
            <button class="menubtn">🕮<h4 class="invisible">History</h4></button>
        </a>
        <a href="info.html">
            <button class="menubtn">🛈<h4 class="invisible">About</h4></button>
        </a>    
    </div>

    <h4 id="titleh4">Введите дату ГОД-МЕСЯЦ-ДЕНЬ</h4>  

    <div id="searchhistory">
        <input type="text" id="histdate" placeholder="YYYY-MM-DD">
        <a href="index.html">
            <button id="findbtn" onclick="get_from_history()">Найти</button>
        <a>
    </div>

    <div class="blocks"></div>
    <script>
        function get_from_history(){
            eel.recreate_appstimer(date=document.querySelector('#histdate').value);
        }
        eel.call_history();
        eel.expose(days_time);
        function days_time(days, time) {
            blocks = document.createElement("div");
            blocks.id = "blocks_container"
            document.body.appendChild(blocks);

            for (let index = 0; index < days.length; index++) {
                let block = document.createElement("a");
                block.id = "block_string";
                block.href = "index.html";
                block.addEventListener("click", function(){
                    eel.recreate_appstimer(days[index]);
                }, false);


                let day = document.createElement("span");
                let day_time = document.createElement("span");
                day.id = "appname"
                day_time.id = "apptime" //id от старых штук в css, чтобы 10 раз одно и тоже не писать

                day.innerText = days[index];
                
                if (day.innerText == "undefined"){
                    day.innerText = "-";
                    day_time.innerText = "-";
                    block.appendChild(day);
                    block.appendChild(day_time);
                    blocks.appendChild(block);
                    continue;
                }
                
                if (time[index] > 59) {
                    day_time.innerText = (time[index] - time[index]%60)/60 + "ч" + time[index]%60 + "м";
                }else{
                    day_time.innerText = "0ч" + time[index] + "м";
                }

                block.appendChild(day);
                block.appendChild(day_time);
                blocks.appendChild(block);

            }
        }

        days_time();

    </script>




</body>
</html>
